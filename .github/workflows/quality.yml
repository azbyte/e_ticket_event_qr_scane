
name: Quality Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Batalkan pemeriksaan lama jika ada perubahan
# baru pada PR yang sama.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Test sync config validator
        run: npm run test:sync-config

      - name: Check backend syntax
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Validate skills
        run: npm run validate:skills

  flutter:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

  quality_gate:
    name: PR Quality Gate
    if: always()
    needs:
      - backend
      - flutter
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality checks to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ] || [ "$FLUTTER_RESULT" != "success" ]; then
            echo "::error::Quality gate blocked: backend=$BACKEND_RESULT, flutter=$FLUTTER_RESULT"
            exit 1
          fi
          echo "All required quality checks passed."
