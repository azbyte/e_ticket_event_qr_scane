name: Sync Direct Child Branches After Merge

# Sinkronisasi direct-child-only: ketika Pull Request berhasil di-merge ke
# suatu branch (source), HANYA direct child yang terdaftar pada source itu
# di .github/sync-config.yaml yang disinkronkan.
#
# Sumber kebenaran tunggal: .github/sync-config.yaml
#
# Pemicu: pull_request ditutup (semua branch, bukan hanya main), difilter
# hanya merged == true. Source diambil secara dinamis dari base.ref.
#
# Sengaja TIDAK menggunakan on.push sehingga push hasil sinkronisasi tidak
# memicu ulang workflow ini. quality.yml hanya terpicu pada push/PR ke main,
# sehingga push ke branch development tidak membentuk loop sinkronisasi.

on:
  pull_request:
    types:
      - closed

permissions:
  # GITHUB_TOKEN perlu izin repository untuk fetch/push; target dibatasi oleh
  # konfigurasi, dan validator menolak main sebagai child.
  contents: write

# Sederakan per source (base.ref). Karena satu child hanya boleh memiliki
# satu parent (ditetapkan konfigurasi), ini melindungi setiap target branch
# dari modifikasi bersamaan tanpa menghambat sinkronisasi source lain.
concurrency:
  group: sync-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sinkronkan direct child dari source
    # Pastikan hanya PR yang benar-benar di-merge yang diproses.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfigurasi git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Validasi konfigurasi dilakukan SEBELUM operasi Git apapun.
      # Jika tidak valid, seluruh proses dihentikan sebelum target
      # manapun dimodifikasi.
      - name: Validasi konfigurasi sinkronisasi
        id: validate
        run: |
          node .github/scripts/validate-sync-config.js validate .github/sync-config.yaml

      # Baca konfigurasi SATU kali dalam satu proses; hasilnya konsisten
      # untuk semua target. Direktif child ditulis ke berkas rencana.
      - name: Tentukan direct child dari source
        id: children
        env:
          SOURCE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          output="$(node .github/scripts/validate-sync-config.js children "$SOURCE" .github/sync-config.yaml)" || {
            echo "::error::Gagal membaca direct child dari konfigurasi"
            exit 1
          }
          case "$output" in
            'SKIPPED: SOURCE_NOT_CONFIGURED')
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "reason=$output" >> "$GITHUB_OUTPUT"
              : > .sync-plan-children.txt
              echo "::notice::$output"
              ;;
            'SKIPPED: NO_DIRECT_CHILDREN')
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              echo "reason=$output" >> "$GITHUB_OUTPUT"
              : > .sync-plan-children.txt
              echo "::notice::$output"
              ;;
            *)
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              echo "reason=direct_children" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$output" > .sync-plan-children.txt
              ;;
          esac
      - name: Sinkronkan setiap direct child secara independen
        if: steps.children.outputs.skipped == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE: origin
          SOURCE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          source="$SOURCE"
          remote="$REMOTE"
          plan=".sync-plan-children.txt"

          echo "Source: $source"
          echo "Direct child target:"
          while IFS= read -r child; do [ -n "$child" ] && echo "  - $child"; done < "$plan"

          # Ambil semua referensi terbaru dari remote sebelum operasi Git.
          git fetch "$remote" --prune

          # Verifikasi source tersedia di remote sebelum target manapun
          # dimodifikasi.
          if ! git ls-remote --exit-code --heads "$remote" "$source" >/dev/null 2>&1; then
            echo "::error::Source '$source' tidak tersedia di remote '$remote'"
            exit 1
          fi

          mapfile -t children < <(grep -v '^[[:space:]]*$' "$plan")

          success=()
          failed=()
          skipped=()

          for child in "${children[@]}"; do
            echo "::group::Sinkronisasi $child"

            # Verifikasi target tersedia di remote sebelum operasi.
            if ! git ls-remote --exit-code --heads "$remote" "$child" >/dev/null 2>&1; then
              echo "TARGET_NOT_FOUND_ON_REMOTE: $child"
              failed+=("$child (tidak tersedia di remote)")
              echo "::endgroup::"
              continue
            fi

            # Checkout / buat branch lokal child dari remote.
            if git rev-parse --verify "refs/heads/$child" >/dev/null 2>&1; then
              git checkout "$child"
            else
              git checkout -b "$child" "$remote/$child"
            fi

            # Up-to-date: source sudah merupakan ancestral dari child -> lewati.
            if git merge-base --is-ancestor "$remote/$source" HEAD; then
              echo "UP_TO_DATE: $child sudah menyertakan perubahan dari $source"
              skipped+=("$child (sudah up-to-date)")
              echo "::endgroup::"
              continue
            fi

            # Integrasikan source ke child dengan merge biasa (bukan rebase /
            # reset paksa / force push). Riwayat dan pekerjaan developer
            # dipertahankan.
            if git merge --no-edit "$remote/$source"; then
              if git push "$remote" "$child"; then
                success+=("$child")
                echo "Berhasil disinkronkan: $child"
              else
                # Push ditolak karena remote berubah: fetch ulang dan periksa
                # kondisi terbaru sebelum mencoba kembali. Tidak ada force push.
                echo "Push ditolak untuk $child, fetch ulang..."
                git fetch "$remote" --prune
                # Periksa kondisi REMOTE target (bukan HEAD lokal, yang mungkin
                # sudah memiliki commit merge yang belum berhasil di-push).
                if git merge-base --is-ancestor "$remote/$source" "$remote/$child"; then
                  echo "UP_TO_DATE_AFTER_FETCH: $child sudah menyertakan perubahan dari $source"
                  skipped+=("$child (sudah up-to-date setelah fetch)")
                else
                  git merge --no-edit "$remote/$source" 2>/dev/null && {
                    if git push "$remote" "$child"; then
                      success+=("$child (berhasil setelah retry)")
                      echo "Berhasil disinkronkan (retry): $child"
                    else
                      failed+=("$child (push ditolak setelah retry)")
                      echo "::warning::Gagal push $child setelah retry"
                    fi
                  } || {
                    git merge --abort 2>/dev/null || true
                    git checkout "$child" -- . 2>/dev/null || true
                    failed+=("$child (konflik setelah fetch ulang)")
                    echo "::warning::Gagal disinkronkan: $child (konflik, perlu resolusi manual)"
                  }
                fi
              fi
            else
              # Konflik: batalkan merge, jangan ubah isi branch, jangan memilih
              # versi secara otomatis, laporkan untuk diselesaikan manual.
              # Kegagalan satu child tidak menghentikan child lain.
              git merge --abort 2>/dev/null || true
              git checkout "$child" -- . 2>/dev/null || true
              failed+=("$child (konflik, perlu resolusi manual)")
              echo "::warning::Gagal disinkronkan: $child (konflik, perlu resolusi manual)"
            fi
            echo "::endgroup::"
          done

          # Kembali ke source branch agar workspace tidak tertinggal di child.
          git checkout "$source" 2>/dev/null || git checkout -B "$source" "$remote/$source" 2>/dev/null || true

          # Ringkasan hasil sinkronisasi
          {
            echo "## Hasil Sinkronisasi Branch (Direct Child Only)"
            echo ""
            echo "Pull Request yang memicu: #${{ github.event.pull_request.number }}"
            echo "Source: $source"
            echo ""
            if [ ${#skipped[@]} -gt 0 ]; then
              echo "### Dilewati (sudah up-to-date)"
              for b in "${skipped[@]}"; do echo "- $b"; done
              echo ""
            fi
            if [ ${#success[@]} -gt 0 ]; then
              echo "### Berhasil disinkronkan"
              for b in "${success[@]}"; do echo "- $b"; done
              echo ""
            fi
            if [ ${#failed[@]} -gt 0 ]; then
              echo "### Gagal disinkronkan (perlu perhatian manual)"
              for b in "${failed[@]}"; do echo "- $b"; done
              echo ""
            fi
            if [ ${#skipped[@]} -eq 0 ] && [ ${#success[@]} -eq 0 ] && [ ${#failed[@]} -eq 0 ]; then
              echo "Tidak ada direct child yang diproses."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Sinkronisasi gagal untuk ${#failed[@]} target; lihat ringkasan job."
            exit 1
          fi
